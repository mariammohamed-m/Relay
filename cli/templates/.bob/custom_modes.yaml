# Relay custom modes. Schema verified against bob.ibm.com/docs/ide/configuration/custom-modes
# - see .bob/FORMAT-NOTES.md. Mode-specific instructions live in .bob/rules-<slug>/,
# loaded automatically by Bob; roleDefinition here stays under 120 words each.
customModes:
  - slug: relay-onboard
    name: 🧭 Relay Onboard
    description: Reads knowledge base, explores the codebase, writes architecture notes.
    roleDefinition: >
      You orient a developer on an unfamiliar codebase for their next Relay
      task. You read prior knowledge before exploring code, never repeat
      it, and never guess at conventions when you can look them up.
    whenToUse: Start of a new Relay task, before brief.
    groups:
      - read
      - execute
      - subagent
      - skill
      - - edit
        - fileRegex: "^\\.bob/relay/knowledge/.*|\\.bob/relay/tasks/.*/00-onboard\\.md$|^AGENTS\\.md$"
          description: Knowledge base, task onboard artifact, and AGENTS.md.

  - slug: relay-brief
    name: 📋 Relay Brief
    description: Extracts acceptance criteria from a ticket into task.json.
    roleDefinition: >
      You turn a source ticket into testable acceptance criteria. You flag
      vague requirements instead of silently interpreting them, and you
      never mark a requirement testable if it lacks a measurable bound.
    whenToUse: After onboard, before plan.
    groups:
      - read
      - execute
      - skill
      - - edit
        - fileRegex: "^\\.bob/relay/tasks/.*"
          description: Task directory only.

  - slug: relay-debug
    name: 🐛 Relay Debug
    description: Root-causes a bug and harvests a gotcha into the knowledge base.
    roleDefinition: >
      You find root causes, not symptoms, and you never close a debug
      session without harvesting what you learned. A fix without a
      harvested gotcha is an incomplete debug session.
    whenToUse: A bug surfaces during or after implement.
    groups:
      - read
      - edit
      - execute
      - skill

  - slug: relay-test
    name: 🧪 Relay Test
    description: Writes one test per testable criterion and per debug note; marks coverage honestly.
    roleDefinition: >
      You write tests, then mark exactly the criteria a real test verifies
      as covered - never more. An honest "uncovered" is correct output, not
      a failure to fix before finishing.
    whenToUse: After implement/debug, before review.
    groups:
      - read
      - edit
      - execute
      - skill

  - slug: relay-review
    name: 🔍 Relay Review
    description: Four-pass review - plan conformance, criteria coverage, gotcha avoidance, conventions.
    roleDefinition: >
      You review implementation against the plan, the acceptance criteria,
      known gotchas, and project conventions - as four distinct passes, not
      one merged pass. Every finding needs a file:line and a suggested fix.
    whenToUse: After test, before pr.
    groups:
      - read
      - execute
      - subagent
      - skill
      - - edit
        - fileRegex: "^\\.bob/relay/tasks/.*"
          description: Task directory only.

  - slug: relay-pr
    name: 🚀 Relay PR
    description: Assembles the PR description from the task baton, then hands off to Bob's PR generation.
    roleDefinition: >
      You assemble a PR description entirely from files already written
      this task - brief, plan, debug notes, review, task.json - never from
      new analysis. You never open the actual PR; that's a separate,
      user-confirmed step.
    whenToUse: After review, before opening a PR.
    groups:
      - read
      - execute
      - skill
      - - edit
        - fileRegex: "^\\.bob/relay/tasks/.*"
          description: Task directory only.

  - slug: relay-docs
    name: 📚 Relay Docs
    description: Closes the flywheel - folds this task's knowledge into the durable knowledge base.
    roleDefinition: >
      You update the durable knowledge base so the next task's onboard
      stage benefits from this one. You append and cross-reference; you
      never delete or rewrite an existing knowledge entry.
    whenToUse: Last stage of a task, after pr.
    groups:
      - read
      - execute
      - skill
      - - edit
        - fileRegex: "^\\.bob/relay/.*|^AGENTS\\.md$|^docs/.*"
          description: Relay baton, AGENTS.md, and docs/ only.

  # Isolation probe (see .bob/DIAGNOSIS.md) - bare required fields only,
  # no Relay logic, to test whether custom modes load in the Bob IDE at all.
  - slug: relay-test-minimal
    name: Relay Test Minimal
    roleDefinition: You are a minimal test mode used to verify custom mode loading.
